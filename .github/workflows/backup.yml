# 매일 DB 백업 (Supabase 무료 플랜엔 자동 백업이 없음)
#
# - 매일 새벽 3시 30분(한국 시간)에 DB를 떠서 암호화한 뒤, 이 실행의 Artifact로 30일 보관
# - 실패하면 GitHub가 저장소 주인에게 메일을 보냄
# - Actions 탭 → "DB 백업" → Run workflow 로 바로 실행해볼 수 있음
#
# 필요한 저장소 Secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL     Supabase → Connect → Session pooler 연결 문자열 (비밀번호 포함)
#                       ※ Direct connection은 IPv6 전용이라 GitHub 실행기에서 안 붙음
#   BACKUP_PASSPHRASE   백업 파일 암호. 잃어버리면 복구 불가 → 비밀번호 관리자에 따로 보관
#
# 복구 방법은 README "백업과 복구" 참고.

name: DB 백업

on:
  schedule:
    - cron: "30 18 * * *" # UTC 18:30 = 한국 03:30 (삭제분 파기 작업 04:00보다 먼저)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: PostgreSQL 17 클라이언트 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17

      - name: 덤프 + 암호화
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "$DB_URL" ] || [ -z "$PASS" ]; then
            echo "::error::SUPABASE_DB_URL / BACKUP_PASSPHRASE 시크릿이 없음"; exit 1
          fi
          PG=/usr/lib/postgresql/17/bin
          mkdir -p out

          # 서비스 테이블·함수 전체 (스키마 + 데이터)
          "$PG/pg_dump" "$DB_URL" --no-owner --no-privileges --schema=public -f out/public.sql
          # 로그인 계정 (todos 등이 auth.users 를 참조하므로 같이 떠야 복구 가능)
          "$PG/pg_dump" "$DB_URL" --data-only --table=auth.users --table=auth.identities -f out/auth.sql

          # 덤프가 비정상(테이블 누락)이면 실패로 처리 → 메일 알림
          for t in categories todos memos; do
            grep -q "^COPY public.$t " out/public.sql || { echo "::error::public.$t 가 덤프에 없음"; exit 1; }
          done
          grep -q "^COPY auth.users " out/auth.sql || { echo "::error::auth.users 가 덤프에 없음"; exit 1; }

          STAMP=$(date -u +%Y%m%d-%H%M)
          tar -czf - -C out . | gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
            --passphrase-file <(printf '%s' "$PASS") -o "dodo-db-$STAMP.tar.gz.gpg"
          rm -rf out
          ls -lh dodo-db-*.gpg
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"

      - name: 보관 (30일)
        uses: actions/upload-artifact@v4
        with:
          name: dodo-db-${{ env.STAMP }}
          path: dodo-db-*.tar.gz.gpg
          retention-days: 30
          if-no-files-found: error
          compression-level: 0
