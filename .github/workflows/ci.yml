# 푸시·PR 마다 타입 검사 + 단위 테스트 + 빌드
#
# 배포 자체는 Cloudflare가 main 푸시를 보고 `npm run build` 로 하는데, build 가 check(tsc + vitest)를
# 먼저 돌리므로 깨진 코드는 거기서도 배포되지 않는다. 이 워크플로는 그걸 GitHub 에서도 보이게(빨간 X, 메일) 하는 용도.

name: 검사

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
